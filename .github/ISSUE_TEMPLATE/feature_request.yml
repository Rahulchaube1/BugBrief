name: Feature request
description: Suggest an improvement to BugBrief
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or user need is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternatives have you considered?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Who benefits and how?
      description: Explain the expected user or maintainer impact.
    validations:
      required: false
