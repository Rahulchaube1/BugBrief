name: BugBrief CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          OPENAI_API_KEY: ci-openai-key
          OPENAI_MODEL: gpt-4o-mini
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          STRIPE_PRO_PRICE_ID: price_ci
          ADMIN_SECRET: ci-admin-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_UPI_ID: chauberahul797@okhdfcbank
          NEXT_PUBLIC_UPI_NAME: BugBrief
